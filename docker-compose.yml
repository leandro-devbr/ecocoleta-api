
services:
  oracle:
    image: gvenzl/oracle-xe:latest
    container_name: oracle-ecocoleta
    environment:
      - ORACLE_PASSWORD=admin_senha_123 # Senha do usuário system/sys
      - APP_USER=ecocoleta              # Usuário da aplicação
      - APP_USER_PASSWORD=ecocoleta_123      # Senha da aplicação
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle_data: