services:
  oracle:
    image: gvenzl/oracle-xe:latest
    container_name: oracle-ecocoleta
    environment:
      - ORACLE_PASSWORD=admin_senha_123
      - APP_USER=ecocoleta
      - APP_USER_PASSWORD=ecocoleta_123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build: .
    container_name: ecocoleta-api
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      - ECOCOLETA_DB_URL=jdbc:oracle:thin:@//oracle:1521/XEPDB1
      - ECOCOLETA_DB_USER=ecocoleta
      - ECOCOLETA_DB_PASSWORD=ecocoleta_123
    ports:
      - "8080:8080"

volumes:
  oracle_data: