spring.application.name=ecocoleta

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:ecocoleta}
spring.datasource.password=${DB_PASSWORD:ecocoleta_123}
